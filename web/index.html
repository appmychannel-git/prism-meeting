<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="prism_meeting">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Prism Meeting</title>
  <link rel="manifest" href="manifest.json">

  <!--
    카카오톡 등 인앱 브라우저 대응:
    딥링크(?room= 회의 / ?uid= 친구추가 / ?cctv= CCTV)로 들어오면 네이티브 앱을 바로 실행.
    (카톡 인앱 웹뷰는 App Links를 무시하고 자체 웹뷰로 열므로, 여기서 명시적으로 앱을 연다.)
    - 안드로이드: intent:// (scheme=https, package 지정, 미설치 시 browser_fallback_url 로 웹 복귀)
    - iOS:       커스텀 스킴 (Universal Link 는 카카오 인앱 웹뷰에서 동작하지 않으므로 스킴으로
                 앱을 연다). 미설치 시 페이지가 남으므로 일정 시간 후 웹 폴백.
    package/scheme 은 브랜드별로 build_web.sh 가 치환한다(__APP_PACKAGE__ / __APP_SCHEME__).
    앱이 없으면 웹(noapp=1)으로 되돌아와 그대로 진행한다.
  -->
  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        // 회의(room)·친구추가(uid)·CCTV(cctv) 딥링크일 때만 앱 실행 시도.
        var isDeepLink = params.get('room') || params.get('uid') || params.get('cctv');
        if (!isDeepLink) return;
        if (params.get('noapp') === '1') return; // 웹 폴백(재시도 방지)
        var ua = navigator.userAgent || '';
        var fb = window.location.origin + window.location.pathname
          + '?' + params.toString() + '&noapp=1';

        // ── 안드로이드: intent:// ──
        if (/Android/i.test(ua)) {
          var intentUrl = 'intent://' + window.location.host
            + window.location.pathname + window.location.search
            + '#Intent;scheme=https;package=__APP_PACKAGE__;'
            + 'S.browser_fallback_url=' + encodeURIComponent(fb) + ';end';
          window.location.href = intentUrl;
          return;
        }

        // ── iOS: 커스텀 스킴 + 타임아웃 폴백 ──
        if (/iPhone|iPad|iPod/i.test(ua)) {
          var scheme = '__APP_SCHEME__://join?' + params.toString();
          var left = false; // 앱으로 전환되면(페이지가 백그라운드로) 폴백 취소
          var onLeave = function () { left = true; };
          document.addEventListener('visibilitychange', function () {
            if (document.hidden) left = true;
          });
          window.addEventListener('pagehide', onLeave);
          window.addEventListener('blur', onLeave);
          setTimeout(function () {
            if (!left) window.location.href = fb; // 앱 미설치 → 웹으로 진행
          }, 1600);
          window.location.href = scheme;          // 앱 실행 시도
          return;
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!--
    앱 미설치 상태에서 "친구추가 링크(?uid=)"가 브라우저로 열린 경우 안내 화면.
    친구추가는 기기 식별/푸시가 필요해 웹에선 동작하지 않으므로, 앱 설치를 유도한다.
    (회의 ?room= / CCTV ?cctv= 는 웹에서도 되므로 이 화면을 띄우지 않는다.)
    __APK_URL__ 은 build_web.sh 가 브랜드별 APK 주소로 치환한다.
  -->
  <div id="install-landing" style="display:none; position:fixed; inset:0;
       align-items:center; justify-content:center; padding:24px; box-sizing:border-box;
       font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',Roboto,sans-serif;
       background:#0e1116; color:#e9edf3;">
    <div style="width:100%; max-width:420px; background:#171b22; border:1px solid #262c37;
         border-radius:16px; padding:28px 22px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.35);">
      <div style="font-size:44px; line-height:1; margin-bottom:14px;">👥</div>
      <h1 style="font-size:20px; margin:0 0 8px;"><span id="il-name">친구</span>이 친구추가를 요청했어요</h1>
      <p style="font-size:14px; color:#aab3c0; margin:0 0 22px; line-height:1.5;">
        친구추가·통화는 <b>앱에서만</b> 됩니다.</p>
      <!-- 안드로이드: APK 다운로드 -->
      <div id="il-android">
        <a id="il-download" href="__APK_URL__"
           style="display:block; background:#3b6ef5; color:#fff; text-decoration:none; font-weight:700;
                  font-size:16px; padding:15px; border-radius:12px; margin-bottom:14px;">앱 설치 (다운로드)</a>
        <p style="font-size:12px; color:#7d8895; margin:0; line-height:1.6;">
          설치가 끝나면 <b>이 링크를 다시 한 번 열어</b>주세요.<br>그러면 앱이 열리고 친구추가가 완료됩니다.</p>
      </div>
      <!-- 아이폰: APK 설치 불가 → 준비 중 안내 -->
      <div id="il-ios" style="display:none;">
        <p style="font-size:15px; color:#e9edf3; margin:0 0 6px; font-weight:600;">아이폰 버전은 준비 중입니다.</p>
        <p style="font-size:12px; color:#7d8895; margin:0;">App Store 출시 예정이에요.</p>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var p = new URLSearchParams(window.location.search);
      // 앱 미설치로 폴백된 "친구추가 링크"면: 플러터(웹) 대신 설치 안내를 띄운다.
      if (p.get('uid') && p.get('noapp') === '1') {
        var nm = (p.get('name') || '').slice(0, 40);
        document.getElementById('il-name').textContent = nm ? (nm + '님') : '친구';
        // 아이폰은 APK 설치가 안 되므로 다운로드 대신 "준비 중" 안내를 보여준다.
        var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent || '');
        if (isIOS) {
          document.getElementById('il-android').style.display = 'none';
          document.getElementById('il-ios').style.display = 'block';
        }
        document.getElementById('install-landing').style.display = 'flex';
        return; // 플러터 로드 안 함
      }
      // 그 외(회의/CCTV/일반)는 정상적으로 앱(웹)을 로드.
      var s = document.createElement('script');
      s.src = 'flutter_bootstrap.js';
      s.async = true;
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
