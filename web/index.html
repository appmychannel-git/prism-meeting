<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="prism_meeting">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Prism Meeting</title>
  <link rel="manifest" href="manifest.json">

  <!--
    카카오톡 등 인앱 브라우저 대응:
    초대 링크(?room=...)로 들어오면 안드로이드에서 intent:// 로 네이티브 앱을 바로 실행.
    앱이 없으면 browser_fallback_url(웹, noapp=1)로 되돌아와 웹으로 진행.
    인앱 브라우저는 App Links를 무시하므로 이 방식으로 앱을 연다.
  -->
  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        if (!params.get('room')) return;        // 초대 링크일 때만
        if (params.get('noapp') === '1') return; // 웹 폴백(재시도 방지)
        if (!/Android/i.test(navigator.userAgent || '')) return; // 안드로이드만(iOS 추후)
        var fb = window.location.origin + window.location.pathname
          + '?' + params.toString() + '&noapp=1';
        var intentUrl = 'intent://' + window.location.host
          + window.location.pathname + window.location.search
          + '#Intent;scheme=https;package=kr.co.mychannel.meeting.prism;'
          + 'S.browser_fallback_url=' + encodeURIComponent(fb) + ';end';
        window.location.href = intentUrl;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
